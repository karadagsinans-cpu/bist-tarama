name: BIST ADX Günlük Tarama

on:
  schedule:
    - cron: '15 15 * * 1-5' # Hafta içi her gün TSİ 18:15
  workflow_dispatch: # Elle çalıştırma

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Taramayı Çalıştır
        run: python tarama.py
